<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script>(function(){var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)})()</script>
<title>Cofre de Senhas</title>
<style>
:root{--bg:#0b1a33;--card:#112544;--c2:#17305a;--tx:#f1f5f9;--mu:#9fb3cf;--ac:#55d8cf;--pt:#0b1a33;--bd:#24406e;--rd:#f87171;--ok:#34d399;--wn:#fbbf24;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f7fa;--card:#fff;--c2:#e8eff5;--tx:#12294f;--mu:#5b6f8c;--ac:#1f8f9a;--pt:#fff;--bd:#cbd8e4;--rd:#dc2626;--ok:#059669;--wn:#d97706;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f7fa;--card:#fff;--c2:#e8eff5;--tx:#12294f;--mu:#5b6f8c;--ac:#1f8f9a;--pt:#fff;--bd:#cbd8e4;--rd:#dc2626;--ok:#059669;--wn:#d97706;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:1.25rem;margin:0;font-weight:700}
h2{font-size:1.2rem;margin:0 0 4px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #55d8cf33}
textarea{min-height:80px;resize:vertical}
button{cursor:pointer;width:auto;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
button:active{transform:scale(.97)}
.p{background:var(--ac);color:var(--pt);border:0}
.g{background:transparent}
.d{color:var(--rd);border-color:var(--rd);background:transparent}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>button{flex:0 0 auto}
.sp{justify-content:space-between}.sp>*{flex:0 1 auto}
label{display:block;font-size:.78rem;font-weight:600;color:var(--mu);margin:14px 0 6px;letter-spacing:.02em}
.m{color:var(--mu);font-size:.85rem}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.top .lg{display:flex;align-items:center;gap:10px}.top img{width:36px;height:36px;border-radius:10px}
.ib{padding:10px 12px;border-radius:12px;line-height:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border-radius:20px;padding:8px 14px;white-space:nowrap;font-size:.88rem;background:var(--card)}
.chips .on{background:var(--ac);color:var(--pt);border-color:var(--ac)}
.chips b{opacity:.7;font-weight:600;margin-left:4px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0;cursor:pointer}
.it:active{background:var(--c2)}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;flex:0 0 auto}
.it .tx{flex:1;min-width:0}.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.it button{padding:8px 12px;font-size:.8rem;border-radius:10px}
.bn{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.bn small{display:block;color:var(--mu);font-size:.8rem}.bn button{padding:9px 14px}
.empty{text-align:center;margin:50px 10px;color:var(--mu)}.empty .big svg{width:54px;height:54px;stroke-width:1.4;color:var(--ac);opacity:.9}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(22px + env(safe-area-inset-bottom));height:56px;padding:0 22px;border-radius:28px;font-size:1rem;box-shadow:0 8px 24px #0006;display:flex;align-items:center;gap:8px}
.pf{position:relative}.pf input{padding-right:50px}
.pf .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--ac);padding:8px 10px;line-height:0}
.sm{height:5px;background:var(--c2);border-radius:3px;margin-top:8px;overflow:hidden}.sm i{display:block;height:100%;width:0;transition:.25s}
.sl{font-size:.75rem;color:var(--mu);margin-top:4px;min-height:1em}
dialog{border:0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--bg);color:var(--tx);max-height:92vh}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.row>div{min-width:0;word-break:break-all}
.row button{padding:8px 12px;font-size:.82rem;border-radius:10px}
.mi{display:flex;width:100%;justify-content:flex-start;text-align:left;margin:8px 0;padding:14px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:1rem;font-weight:600;color:var(--tx);letter-spacing:0;cursor:pointer}
.mi b{display:block;font-weight:600}
.mi small{display:block;font-weight:400;color:var(--mu);font-size:.8rem;margin-top:2px}
.mi.d{color:var(--rd);border-color:var(--rd);background:transparent}
.lock{text-align:center;padding-top:7vh}.lock img{width:112px;height:112px;border-radius:28px;box-shadow:0 10px 30px #0006}
.lock .go{width:100%;margin-top:14px;padding:15px}
.seg>button{flex:1}
.tg{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:5}
.err{color:var(--rd);min-height:1.3em;font-size:.88rem;margin:10px 0 0}
.lk{display:inline-block;margin-top:22px;color:var(--ac);font-size:.88rem;cursor:pointer;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none;font-size:.9rem;font-weight:600;z-index:99;white-space:nowrap}
#toast.s{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const CATS=['Apps','Sites','Bancos','Dados'],COL={Apps:'#a78bfa',Sites:'#38bdf8',Bancos:'#34d399',Dados:'#fbbf24'};
let key,salt,items=[],cat='Todos',q='',timer,cbT,ip=null,screen='lock';
const IC={
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
dots:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22M14.1 14.1a3 3 0 1 1-4.2-4.2"/>',
refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>'};
const ic=(n,z)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${z?` style="width:${z}px;height:${z}px"`:''}>${IC[n]}</svg>`;
const COLL={Apps:'#7c3aed',Sites:'#0284c7',Bancos:'#059669',Dados:'#b45309'};
const getT=()=>localStorage.getItem('theme')||'auto';
const isDark=()=>getT()==='dark'||(getT()==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
const cc=c=>(isDark()?COL:COLL)[c];
function applyTheme(){const t=getT();t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').content=isDark()?'#0b1a33':'#f3f7fa'}
function setTheme(t){localStorage.setItem('theme',t);applyTheme();if(screen==='list')renderList()}
const themeBtn=()=>ic(isDark()?'sun':'moon');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();if(screen==='list')renderList()});
applyTheme();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2000)};
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);

/* ---------- criptografia ---------- */
async function derive(pw,s){
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function save(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(items)));
  localStorage.setItem('vault',JSON.stringify({s:b64(salt),iv:b64(iv),d:b64(ct)}));
}
async function unlock(pw){
  const v=JSON.parse(localStorage.getItem('vault'));
  salt=ub64(v.s);key=await derive(pw,salt);
  items=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(v.iv)},key,ub64(v.d))));
}
function lock(){key=null;items=[];if($('#dlg').open)$('#dlg').close();renderLock()}
function bump(){clearTimeout(timer);if(key)timer=setTimeout(lock,60000)}
['click','touchstart','keydown'].forEach(e=>addEventListener(e,bump));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&key)lock()});

/* ---------- utilidades ---------- */
function gen(n=18){
  const set='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?-_';
  return [...crypto.getRandomValues(new Uint32Array(n))].map(x=>set[x%set.length]).join('');
}
async function copy(t,msg='Copiado! Limpa em 30s'){
  try{await navigator.clipboard.writeText(t);toast(msg)}catch(_){return toast('Não foi possível copiar')}
  clearTimeout(cbT);cbT=setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),30000);
}
function strength(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s}
const meter=()=>'<div class="sm"><i></i></div><div class="sl"></div>';
function bindMeter(inp,root){
  const bar=root.querySelector('.sm i'),lab=root.querySelector('.sl');
  const up=()=>{const p=inp.value,s=strength(p);if(!p){bar.style.width='0';lab.textContent='';return}
    const L=s<=2?['Fraca','var(--rd)']:s==3?['Média','var(--wn)']:['Forte','var(--ok)'];
    bar.style.width=(s*20)+'%';bar.style.background=L[1];lab.textContent='Força: '+L[0]};
  inp.addEventListener('input',up);up();
}
const pwf=(id,ph,v='')=>`<div class="pf"><input id="${id}" type="password" placeholder="${ph}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="eye" data-t="${id}" aria-label="Mostrar ou ocultar senha">${ic('eye')}</button></div>`;
function bindEyes(root=document){root.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{
  const i=root.querySelector('#'+b.dataset.t),h=i.type==='password';i.type=h?'text':'password';b.innerHTML=ic(h?'eyeoff':'eye')})}
function sheet(html){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal();bindEyes(d);return d}
const backupAge=()=>{const t=+localStorage.getItem('bk')||0;return t?(Date.now()-t)/864e5:Infinity};
function installBanner(){
  if(standalone())return'';
  const msg=ip?'Use como app, direto da tela inicial.':ios?'Toque em Compartilhar e depois em “Adicionar à Tela de Início”.':'Abra o menu do navegador (três pontinhos) e toque em “Instalar app” ou “Adicionar à tela inicial”.';
  return `<div class="bn"><div><b>Instalar no celular</b><small>${msg}</small></div>${ip?'<button class="p" id="inst">Instalar</button>':''}</div>`;
}
function bindInstall(){const b=$('#inst');if(b)b.onclick=async()=>{ip.prompt();await ip.userChoice;ip=null;screen==='lock'?renderLock():menu()}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(screen==='lock'&&!key)renderLock()});

/* ---------- tela de bloqueio ---------- */
function renderLock(){
  screen='lock';
  const novo=!localStorage.getItem('vault');
  $('#app').innerHTML=`<button class="ib g tg" id="th0" title="Alternar tema">${themeBtn()}</button><div class="lock"><img src="icon-192.png" alt=""><h2 style="margin-top:18px">Cofre de Senhas</h2>
  <p class="m" style="margin:4px 0 20px">${novo?'Crie uma senha mestra para proteger tudo. Ela é a única chave do cofre e não pode ser recuperada.':'Digite sua senha mestra para entrar.'}</p>
  ${pwf('pw','Senha mestra')}
  ${novo?meter()+'<div style="height:10px"></div>'+pwf('pw2','Repita a senha mestra'):''}
  <div class="err" id="err"></div>
  <button class="p go" id="go">${novo?'Criar meu cofre':'Entrar'}</button>
  ${novo?'<label class="lk">Já usei o app antes? Restaurar backup<input type="file" id="imp0" accept=".json" hidden></label>':''}
  <div style="margin-top:24px;text-align:left">${installBanner()}</div></div>`;
  bindEyes();bindInstall();
  $('#th0').onclick=e=>{setTheme(isDark()?'light':'dark');e.currentTarget.innerHTML=themeBtn()};
  const pw=$('#pw'),pw2=$('#pw2'),err=$('#err');
  if(novo)bindMeter(pw,$('.lock'));
  const go=async()=>{
    try{
      if(novo){
        if(pw.value.length<8)return err.textContent='Use pelo menos 8 caracteres.';
        if(pw.value!==pw2.value)return err.textContent='As senhas não conferem.';
        salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pw.value,salt);items=[];await save();
      }else{err.textContent='Verificando...';await unlock(pw.value)}
      cat='Todos';q='';renderList();bump();
    }catch(e){err.textContent='Senha incorreta.';pw.select()}
  };
  $('#go').onclick=go;
  pw.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();novo?pw2.focus():go()}});
  if(pw2)pw2.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  if($('#imp0'))$('#imp0').onchange=importar;
}

/* ---------- lista ---------- */
function renderList(){
  screen='list';
  const cnt=c=>items.filter(i=>c==='Todos'||i.cat===c).length;
  const list=items.filter(i=>(cat==='Todos'||i.cat===cat)&&(i.title+i.user+i.url).toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>a.title.localeCompare(b.title));
  const old=items.length&&backupAge()>14;
  $('#app').innerHTML=`<div class="top"><div class="lg"><img src="icon-192.png" alt=""><h1>Meu Cofre</h1></div>
    <div class="r"><button class="ib g" id="th" title="Alternar tema">${themeBtn()}</button><button class="ib g" id="lk" title="Bloquear" aria-label="Bloquear">${ic('lock')}</button><button class="ib g" id="menu" title="Configurações" aria-label="Configurações">${ic('dots')}</button></div></div>
  <input id="q" type="search" placeholder="Buscar por nome ou usuário" value="${esc(q)}">
  <div class="chips">${['Todos',...CATS].map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c}<b>${cnt(c)}</b></button>`).join('')}</div>
  ${old?`<div class="bn"><div><b>Faça um backup</b><small>Seus dados ficam só neste aparelho. Salve uma cópia de segurança.</small></div><button class="p" id="bk">Salvar</button></div>`:''}
  ${list.map(i=>`<div class="it" data-id="${i.id}"><div class="av" style="background:${cc(i.cat)}2e;color:${cc(i.cat)}">${esc(i.title[0]||'?').toUpperCase()}</div>
    <div class="tx"><b>${esc(i.title)}</b><small>${esc(i.user)||i.cat}</small></div><button class="g cp" data-id="${i.id}" title="Copiar senha" aria-label="Copiar senha">${ic('copy',18)}</button></div>`).join('')
    ||`<div class="empty"><div class="big">${ic('shield')}</div><p>${items.length?'Nada encontrado.':'Seu cofre está vazio.<br>Toque em “Novo” para guardar sua primeira senha.'}</p></div>`}
  <button class="p fab" id="add">${ic('plus')} Novo</button>`;
  $('#q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;renderList();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderList()});
  document.querySelectorAll('.it').forEach(e=>e.onclick=()=>detail(e.dataset.id));
  document.querySelectorAll('.cp').forEach(b=>b.onclick=ev=>{ev.stopPropagation();copy(items.find(x=>x.id===b.dataset.id).pass)});
  $('#add').onclick=()=>form();$('#menu').onclick=menu;$('#lk').onclick=lock;$('#th').onclick=()=>setTheme(isDark()?'light':'dark');
  if($('#bk'))$('#bk').onclick=exportar;
}

/* ---------- detalhe / formulário ---------- */
function detail(id){
  const i=items.find(x=>x.id===id);let vis=false;
  const d=sheet(`<div class="r" style="justify-content:flex-start;margin-bottom:8px"><div class="av" style="background:${cc(i.cat)}2e;color:${cc(i.cat)};flex:0 0 44px">${esc(i.title[0]).toUpperCase()}</div>
  <div><h2>${esc(i.title)}</h2><span class="m">${i.cat}</span></div></div>
  ${i.url?`<label>SITE OU APP</label><div class="row"><div>${esc(i.url)}</div></div>`:''}
  <label>USUÁRIO / LOGIN</label><div class="row"><div>${esc(i.user)||'—'}</div><button id="cu">Copiar</button></div>
  <label>SENHA</label><div class="row"><div id="pv" style="font-family:ui-monospace,monospace">••••••••••</div><div class="r" style="flex:0 0 auto"><button id="sh" aria-label="Mostrar ou ocultar senha">${ic('eye')}</button><button class="p" id="cp">Copiar</button></div></div>
  ${i.notes?`<label>NOTAS</label><div class="row" style="white-space:pre-wrap">${esc(i.notes)}</div>`:''}
  <div class="r" style="margin-top:22px"><button class="g" id="ed">Editar</button><button class="d" id="dl">Excluir</button><button class="p" id="fc">Fechar</button></div>`);
  d.querySelector('#sh').onclick=e=>{vis=!vis;d.querySelector('#pv').textContent=vis?i.pass:'••••••••••';e.currentTarget.innerHTML=ic(vis?'eyeoff':'eye')};
  d.querySelector('#cp').onclick=()=>copy(i.pass);
  d.querySelector('#cu').onclick=()=>copy(i.user,'Usuário copiado');
  d.querySelector('#fc').onclick=()=>d.close();
  d.querySelector('#ed').onclick=()=>form(i);
  d.querySelector('#dl').onclick=async()=>{if(confirm('Excluir “'+i.title+'”? Não dá para desfazer.')){items=items.filter(x=>x.id!==id);await save();d.close();renderList()}};
}
function form(i={}){
  const cur=i.cat||(cat!=='Todos'?cat:'Sites');
  const d=sheet(`<h2>${i.id?'Editar item':'Novo item'}</h2>
  <label>CATEGORIA</label><select id="fc">${CATS.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join('')}</select>
  <label>NOME</label><input id="ft" value="${esc(i.title)}" placeholder="Ex: Nubank, Instagram, Wi-Fi de casa">
  <label>SITE OU APP (OPCIONAL)</label><input id="fu" value="${esc(i.url)}" placeholder="Ex: nubank.com.br" autocapitalize="off">
  <label>USUÁRIO / LOGIN / CPF</label><input id="fl" value="${esc(i.user)}" autocomplete="off" autocapitalize="off">
  <label>SENHA</label>${pwf('fp','Senha',i.pass)}${meter()}
  <button class="g" id="fg" style="margin-top:10px;width:100%">${ic('refresh',18)} Gerar senha forte</button>
  <label>NOTAS (AGÊNCIA, CONTA, PERGUNTAS SECRETAS...)</label><textarea id="fn">${esc(i.notes)}</textarea>
  <div class="r" style="margin-top:18px"><button class="g" id="fx">Cancelar</button><button class="p" id="fs" style="flex:2">Salvar</button></div>`);
  const fp=d.querySelector('#fp');bindMeter(fp,d);
  d.querySelector('#fg').onclick=()=>{fp.value=gen();fp.type='text';d.querySelector('.eye').innerHTML=ic('eyeoff');fp.dispatchEvent(new Event('input'))};
  d.querySelector('#fx').onclick=()=>i.id?detail(i.id):d.close();
  d.querySelector('#fs').onclick=async()=>{
    const v=s=>d.querySelector(s).value.trim();
    if(!v('#ft'))return toast('Informe um nome');
    const o={id:i.id||crypto.randomUUID(),cat:v('#fc'),title:v('#ft'),url:v('#fu'),user:v('#fl'),pass:fp.value,notes:v('#fn')};
    items=i.id?items.map(x=>x.id===i.id?o:x):[...items,o];
    await save();d.close();renderList();toast('Salvo com segurança');
  };
}

/* ---------- menu e backup ---------- */
function exportar(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([localStorage.getItem('vault')],{type:'application/json'}));
  a.download='cofre-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  localStorage.setItem('bk',Date.now());toast('Backup salvo');if(screen==='list')renderList();
}
function menu(){
  const bk=backupAge();
  const d=sheet(`<h2>Configurações</h2><p class="m" style="margin:0 0 8px">Bloqueio automático após 1 minuto sem uso.</p>
  <label>TEMA</label><div class="r seg" style="margin-bottom:6px">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([k,n])=>`<button class="${getT()===k?'p':'g'}" data-t="${k}">${n}</button>`).join('')}</div>
  ${installBanner()}
  <button class="mi" id="mb">${ic('download')}<span><b>Salvar backup</b><small>Baixa uma cópia criptografada. ${bk===Infinity?'Você ainda não fez nenhum.':'Último: há '+Math.floor(bk)+' dia(s).'}</small></span></button>
  <label class="mi">${ic('upload')}<span><b>Restaurar backup</b><small>Substitui o cofre atual por um arquivo salvo antes.</small></span><input type="file" id="mi" accept=".json" hidden></label>
  <button class="mi" id="ml">${ic('lock')}<span><b>Bloquear agora</b></span></button>
  <button class="mi d" id="mw">${ic('trash')}<span><b>Apagar tudo</b><small>Remove todos os dados deste aparelho.</small></span></button>
  <div class="bn" style="margin-top:16px"><div><b>Por que fazer backup?</b><small>Suas senhas ficam só neste aparelho. Se você trocar de celular, limpar os dados do navegador ou desinstalar o app, elas somem. O backup é um arquivo criptografado que só abre com a sua senha mestra. Guarde-o no Google Drive, e-mail ou computador.</small></div></div>
  <button class="p" id="mc" style="width:100%;margin-top:6px">Fechar</button>`);
  bindInstall();
  d.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{setTheme(b.dataset.t);menu()});
  d.querySelector('#mc').onclick=()=>d.close();
  d.querySelector('#ml').onclick=lock;
  d.querySelector('#mb').onclick=exportar;
  d.querySelector('#mi').onchange=importar;
  d.querySelector('#mw').onclick=()=>{if(confirm('Apagar TODOS os dados deste aparelho? Não tem volta.')&&confirm('Tem certeza absoluta?')){localStorage.removeItem('vault');lock()}};
}
async function importar(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const t=await f.text(),v=JSON.parse(t);if(!v.s||!v.iv||!v.d)throw 0;
    if(localStorage.getItem('vault')&&!confirm('Isso substituirá o cofre atual. Continuar?'))return;
    localStorage.setItem('vault',t);lock();toast('Backup restaurado. Use a senha mestra dele.');
  }catch(_){toast('Arquivo de backup inválido')}
}
renderLock();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
